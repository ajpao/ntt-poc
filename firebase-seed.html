<style>

button{font-family:'Share Tech Mono',monospace;font-size:1rem;padding:14px 28px;background:#ff6b00;color:#fff;border:none;border-radius:6px;cursor:pointer;letter-spacing:2px;margin:10px 4px}
button:disabled{background:#7b8cae;cursor:not-allowed}
button.danger{background:#ff3355}
.log{background:#0c1424;border:1px solid #1d2f50;border-radius:6px;padding:14px;margin-top:20px;font-size:.85rem;min-height:60px;white-space:pre-wrap}
.ok{color:#00e5a0}.err{color:#ff3355}.warn{color:#ffcc00}.info{color:#3399ff}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:.78rem}
th,td{border:1px solid #1d2f50;padding:6px 8px;text-align:left}
th{background:#0a1120;color:#a855f7}
.warn-box{background:rgba(255,204,0,.1);border:1px solid #ffcc00;border-radius:6px;padding:14px;margin:18px 0;color:#ffcc00}
</style>

<p>Push 21 VM Inventory baseline rows into Firebase Realtime Database <code>/poc-vm</code>.</p>

⚠ <b>WARNING:</b> This will <b>OVERWRITE</b> all current data in Firebase <code>/poc-vm</code>.<br>
Use this <b>once</b> to bootstrap, or to reset to the baseline.

<button class="danger" onclick="doClear()">🗑 CLEAR /poc-vm (DANGER)</button>

// Render preview
(function(){
  const t=document.getElementById('preview');
  t.innerHTML='<tr><th>#</th><th>NAME</th><th>SITE</th><th>OS</th><th>IP</th></tr>'+
    VM_DATA.map((v,i)=>`<tr><td>${i+1}</td><td>${v.name}</td><td>${v.site}</td><td>${v.os}</td><td>${v.ip}</td></tr>`).join('');
})();

let fbVm=null;
try{
  firebase.initializeApp({
    apiKey:"AIzaSyB1tDvD2NLYCyxQqA_WxKNF6LnTWUfVtEM",
    authDomain:"ntt-poc-22474.firebaseapp.com",
    projectId:"ntt-poc-22474",
    storageBucket:"ntt-poc-22474.firebasestorage.app",
    messagingSenderId:"1082839485570",
    appId:"1:1082839485570:web:f3fa78b89bef78ee5d389b",
    databaseURL:"https://ntt-poc-22474-default-rtdb.asia-southeast1.firebasedatabase.app"
  });
  fbVm=firebase.database().ref('poc-vm');
  log('Firebase connected to /poc-vm','ok');
}catch(e){log('Firebase init failed: '+e.message,'err');}

function log(msg,cls=''){
  const el=document.getElementById('log');
  const time=new Date().toLocaleTimeString();
  el.innerHTML+=`\n<span class="${cls}">[${time}] ${msg}</span>`;
  el.scrollTop=el.scrollHeight;
}

async function doSeed(){
  if(!fbVm)return log('Firebase not ready','err');
  if(!confirm('Push 21 rows to Firebase? This OVERWRITES current /poc-vm.'))return;
  const btn=document.getElementById('btnSeed');btn.disabled=true;
  log('Pushing '+VM_DATA.length+' rows...','info');
  try{
    await fbVm.set(JSON.stringify(VM_DATA));
    log('✓ Seed completed. Firebase now has '+VM_DATA.length+' VM entries.','ok');
  }catch(e){log('✗ Push failed: '+e.message,'err');}
  btn.disabled=false;
}

async function doClear(){
  if(!fbVm)return log('Firebase not ready','err');
  if(!confirm('CLEAR all data at /poc-vm? This cannot be undone.'))return;
  try{await fbVm.remove();log('✓ /poc-vm cleared.','warn');}
  catch(e){log('✗ Clear failed: '+e.message,'err');}
}

async function doRead(){
  if(!fbVm)return log('Firebase not ready','err');
  try{
    const snap=await fbVm.once('value');
    const raw=snap.val();
    if(!raw){log('Firebase /poc-vm is EMPTY','warn');return;}
    try{
      const arr=JSON.parse(raw);
      log('Firebase /poc-vm has '+(Array.isArray(arr)?arr.length:'?')+' entries.','ok');
    }catch{log('Raw (not JSON): '+raw.slice(0,200),'info');}
  }catch(e){log('✗ Read failed: '+e.message,'err');}
}
</script>
</body>
</html>
