name: Deploy to Firebase Hosting

on:
  workflow_dispatch:   # กด deploy เองได้จาก GitHub Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NTT_POC_22474 }}
          channelId: live
          projectId: ntt-poc-22474
